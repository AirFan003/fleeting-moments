<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fleeting moments — particles</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <video id="webcam" playsinline muted></video>
      <video id="webcam-preview" playsinline muted aria-hidden="true"></video>
      <canvas id="canvas"></canvas>
      <p class="hint">
        Tap a dot to open its orb, or use hands: right index selects (glow), left hand spread/pinch drives bloom. Ease
        the pinch partway closed (not necessarily all the way) to finish and pick another node.
      </p>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
