<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fleeting moments — particles</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <video id="webcam" playsinline muted></video>
      <canvas id="canvas"></canvas>
      <p class="hint">
        Tap a dot to open its orb; tap the center again to shrink. Allow camera access — point your right index
        finger at a particle to see it glow (pinch-to-bloom comes next).
      </p>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
